<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./dist/output.css" rel="stylesheet" />
    <title>Tailwind Practice</title>
  </head>
  <body class="bg-gray-100">
    <!-- Product Feature Card -->
    <article
      class="relative w-80 h-[425px] bg-[#FFF9F9] m-24 rounded-2xl overflow-hidden shadow-xl"
    >
      <!-- Overlay -->
      <div
        class="relative w-full h-[70%] bg-[#E99B24] [clip-path:polygon(0_0,_100%_0,_100%_50%,_50%_75%,_0_100%)] text-left"
      >
        <!-- Text Box -->
        <div class="absolute max-w-[180px] top-4 left-4 space-y-0.5">
          <h2 class="font-playwrite text-2xl text-[#003E7C]">Title Here</h2>
          <p class="font-iowan-old text-white text-lg opacity-90">
            Lorem ipsum at viverra concensircurr
          </p>
        </div>

        <!-- Price Tag -->
        <div
          class="absolute top-6 right-6 bg-[#F1DBDB] w-[75px] h-[75px] rounded-full flex justify-center items-center shadow-lg border border-[#FFF9F9]"
        >
          <p class="font-playball italic antialiased text-2xl text-[#003E7C]">
            $80
          </p>
        </div>
      </div>
      <!-- Product Display -->
      <div
        class="absolute top-[30%] left-1/2 -translate-x-1/2 rounded-full w-[200px] h-[200px] bg-[#F1DBDB]"
      >
        <img
          class="w-full h-full rounded-full object-cover absolute -top-3 -right-3 border-2 border-[#FFF9F9] shadow-xl"
          src="https://images.unsplash.com/photo-1580870069867-74c57ee1bb07?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Product"
        />
      </div>

      <div
        class="absolute bottom-[5%] left-1/2 -translate-x-1/2 flex justify-between items-center w-full"
      >
        <div class="flex justify-center items-center gap-2 ml-4">
          <span class="w-[8px] h-[8px] rounded-full bg-[#E99B24]"></span>
          <span class="w-[8px] h-[8px] rounded-full bg-[#E99B24]"></span>
          <span class="w-[8px] h-[8px] rounded-full bg-[#E99B24]"></span>
          <span class="w-[8px] h-[8px] rounded-full bg-[#E99B24]/50"></span>
          <span class="w-[8px] h-[8px] rounded-full bg-[#E99B24]/50"></span>
        </div>
        <button
          class="bg-[#003E7C] px-6 py-2 text-slate-100 tracking-wider font-inter font-semibold uppercase text-xs rounded-3xl mr-4 hover:bg-[#003264] hover:cursor-pointer transition-colors duration-200 antialiased"
        >
          Add To Cart
        </button>
      </div>
    </article>
  </body>
</html>
